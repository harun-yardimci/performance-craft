<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiln &amp; Co. (after)</title>
<style>
* { box-sizing: border-box; margin: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #1c1917; background: #fafaf9; }
.promo { background: #e07a5f; color: #fff; padding: 14px 20px; font-weight: 600; min-height: 48px; }
header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; }
.logo { font-weight: 800; letter-spacing: -.02em; font-size: 20px; }
.hero { position: relative; height: 56vw; max-height: 520px; display: flex; align-items: flex-end; padding: 24px; color: #fff; overflow: hidden; }
.hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; }
.hero h1 { font-size: clamp(28px, 6vw, 56px); letter-spacing: -.03em; text-shadow: 0 2px 20px rgba(0,0,0,.35); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; padding: 20px; }
.card { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.06); }
.card img { width: 100%; height: auto; display: block; }
.card div { padding: 10px 12px; font-size: 14px; display: flex; justify-content: space-between; }
.card button { margin: 0 12px 12px; height: 36px; width: calc(100% - 24px); border: 0; border-radius: 9px; background: #1c1917; color: #fff; font-weight: 600; }
.status { padding: 0 20px 40px; color: #57534e; min-height: 20px; }
</style>
</head><body>
<!-- Space for the promo bar is reserved, so it fills in without pushing content down. -->
<div class="promo" id="promo"></div>
<header><span class="logo">Kiln &amp; Co.</span><span>Cart (0)</span></header>
<!-- The hero is a real <img> in the server HTML: found by the preload scanner, high priority, right-sized. -->
<section class="hero"><img src="img/hero-800.webp" srcset="img/hero-800.webp 800w, img/hero-1200.webp 1200w" sizes="100vw" width="1200" height="600" alt="" fetchpriority="high"><h1>Handmade ceramics, fired in small batches</h1></section>
<main class="grid">
  <article class="card"><img src="img/p1-480.webp" width="480" height="480" alt="Speckled mug" loading="lazy" decoding="async"><div><span>Speckled mug</span><b>$28</b></div><button class="add">Add to cart</button></article>
  <article class="card"><img src="img/p2-480.webp" width="480" height="480" alt="Stoneware bowl" loading="lazy" decoding="async"><div><span>Stoneware bowl</span><b>$42</b></div><button class="add">Add to cart</button></article>
  <article class="card"><img src="img/p3-480.webp" width="480" height="480" alt="Bud vase" loading="lazy" decoding="async"><div><span>Bud vase</span><b>$35</b></div><button class="add">Add to cart</button></article>
  <article class="card"><img src="img/p4-480.webp" width="480" height="480" alt="Serving plate" loading="lazy" decoding="async"><div><span>Serving plate</span><b>$56</b></div><button class="add">Add to cart</button></article>
</main>
<p class="status" id="status"></p>
<script src="app.js" defer></script>
</body></html>
